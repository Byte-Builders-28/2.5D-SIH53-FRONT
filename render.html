<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>BB25L LiDAR Viewer</title>

		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #111;
			}

			body {
				position: relative;
			}

			canvas {
				display: block;
			}

			/* ========================================================
			   Top Bar
			   ======================================================== */

			#topbar {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;

				z-index: 10;

				display: flex;
				align-items: center;
				gap: 16px;

				height: 48px;
				padding: 0 14px;

				background: rgba(17, 17, 17, 0.92);
				border-bottom: 1px solid rgba(255, 255, 255, 0.08);

				backdrop-filter: blur(8px);
			}

			#title {
				font-size: 14px;
				font-weight: 600;
				letter-spacing: 0.02em;

				white-space: nowrap;
			}

			/* ========================================================
			   View Tabs
			   ======================================================== */

			#view-tabs {
				display: flex;
				align-items: stretch;
				height: 100%;
				gap: 2px;
			}

			.view-tab {
				border: 0;
				outline: none;

				padding: 0 14px;

				background: transparent;
				color: #999;

				font: inherit;
				font-size: 13px;

				cursor: pointer;

				border-bottom: 2px solid transparent;
			}

			.view-tab:hover {
				color: #ddd;
			}

			.view-tab.active {
				color: #fff;
				border-bottom-color: #4488bb;
			}

			/* ========================================================
			   Info
			   ======================================================== */

			#info {
				position: fixed;
				top: 62px;
				left: 14px;

				z-index: 5;

				color: #fff;

				font-family: monospace;
				font-size: 12px;
				line-height: 1.45;

				white-space: pre;

				pointer-events: none;

				text-shadow:
					0 1px 2px #000,
					0 0 4px #000;
			}

			/* ========================================================
			   Playback
			   ======================================================== */

			#playback {
				position: fixed;
				left: 14px;
				right: 14px;
				bottom: 14px;

				z-index: 10;

				display: flex;
				align-items: center;
				gap: 10px;

				padding: 10px 12px;

				background: rgba(17, 17, 17, 0.92);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 6px;

				backdrop-filter: blur(8px);
			}

			#play-button {
				width: 34px;
				height: 28px;

				padding: 0;

				border: 1px solid #444;
				border-radius: 4px;

				background: #222;
				color: #fff;

				cursor: pointer;
			}

			#play-button:hover {
				background: #2a2a2a;
			}

			#frame-slider {
				flex: 1;

				min-width: 0;

				cursor: pointer;
			}

			#frame-label {
				min-width: 110px;

				color: #bbb;

				font-family: monospace;
				font-size: 12px;
				text-align: right;

				white-space: nowrap;
			}
		</style>
	</head>

	<body>
		<!-- ============================================================
		     Application UI
		     ============================================================ -->

		<header id="topbar">
			<div id="title">BB25L LiDAR Viewer</div>

			<nav id="view-tabs">
			<button class="view-tab active" data-view="raster" type="button">
				Raster 3D
			</button>

			<button class="view-tab" data-view="raster2d" type="button">
				Raster 2D
			</button>
		</nav>
		</header>

		<div id="info">Loading...</div>

		<div id="playback">
			<button id="play-button" type="button" aria-label="Play or pause">
				▶
			</button>

			<input
				id="frame-slider"
				type="range"
				min="0"
				max="991"
				value="0"
				step="1" />

			<div id="frame-label">Frame 0000 / 0991</div>
		</div>

		<!-- ============================================================
		     Three.js
		     ============================================================ -->

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
				}
			}
		</script>

		<!-- ============================================================
		     BB25L Decoder Dependencies
		     ============================================================ -->

		<script src="./js/decode/fzstd.js"></script>
		<script src="./js/decode/bb25l.js"></script>

		<!-- ============================================================
		     Application
		     ============================================================ -->

		<script type="module">
			import { RASTER_FRAME_COUNT } from "./js/view/raster_view.js";

			import "./js/main.js";

			// ========================================================
			// UI
			// ========================================================

			const playButton = document.getElementById("play-button");

			const frameSlider = document.getElementById("frame-slider");

			const frameLabel = document.getElementById("frame-label");

			const viewTabs = document.querySelectorAll(".view-tab");

			// ========================================================
			// Frame Slider
			// ========================================================

			frameSlider.max = RASTER_FRAME_COUNT - 1;

			frameSlider.value = 0;

			function updateFrameLabel(frame) {
				frameLabel.textContent =
					`Frame ${frame.toString().padStart(4, "0")} / ` +
					`${(RASTER_FRAME_COUNT - 1).toString().padStart(4, "0")}`;
			}

			frameSlider.addEventListener("input", () => {
				app.getPlayback().seekFrame(Number(frameSlider.value));
			});

			// ========================================================
			// Play / Pause
			// ========================================================

			playButton.addEventListener("click", () => {
				app.getPlayback().toggle();
			});

			// ========================================================
			// View Tabs
			// ========================================================

			for (const tab of viewTabs) {
				tab.addEventListener("click", () => {
					const viewName = tab.dataset.view;

					if (!app.getViewManager().hasView(viewName)) {
						return;
					}

					app.setView(viewName);

					for (const otherTab of viewTabs) {
						otherTab.classList.toggle("active", otherTab === tab);
					}
				});
			}

			// ========================================================
			// Playback UI Synchronization
			// ========================================================

			app.getPlayback().setFrameCallback((frame) => {
				frameSlider.value = frame;

				updateFrameLabel(frame);
			});

			app.getPlayback().setStateCallback((state) => {
				playButton.textContent = state.playing ? "❚❚" : "▶";
			});

			// ========================================================
			// Initial UI
			// ========================================================

			updateFrameLabel(0);
		</script>
	</body>
</html>
