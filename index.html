<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>LiDimention | Adaptive 2.5D LiDAR Mapping</title>
	</head>

	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/home.css" />

	<body>
		<div class="background">
			<div class="grid"></div>
			<div class="glow"></div>

			<div class="lidar">
				<div class="ring ring-1"></div>
				<div class="ring ring-2"></div>
				<div class="ring ring-3"></div>
				<div class="ring ring-4"></div>

				<div class="points">
					<span
						class="point"
						style="left: 23%; top: 31%; animation-delay: 0.2s"></span>
					<span
						class="point"
						style="left: 31%; top: 23%; animation-delay: 0.8s"></span>
					<span
						class="point"
						style="left: 42%; top: 17%; animation-delay: 1.4s"></span>
					<span
						class="point"
						style="left: 62%; top: 20%; animation-delay: 0.4s"></span>
					<span
						class="point"
						style="left: 73%; top: 30%; animation-delay: 1.8s"></span>
					<span
						class="point"
						style="left: 80%; top: 43%; animation-delay: 0.9s"></span>
					<span
						class="point"
						style="left: 75%; top: 62%; animation-delay: 2.1s"></span>
					<span
						class="point"
						style="left: 66%; top: 75%; animation-delay: 0.6s"></span>
					<span
						class="point"
						style="left: 48%; top: 82%; animation-delay: 1.7s"></span>
					<span
						class="point"
						style="left: 30%; top: 73%; animation-delay: 2.4s"></span>
					<span
						class="point"
						style="left: 20%; top: 58%; animation-delay: 1.1s"></span>
					<span
						class="point"
						style="left: 17%; top: 43%; animation-delay: 2.7s"></span>
					<span
						class="point"
						style="left: 37%; top: 38%; animation-delay: 0.5s"></span>
					<span
						class="point"
						style="left: 58%; top: 35%; animation-delay: 1.9s"></span>
					<span
						class="point"
						style="left: 63%; top: 58%; animation-delay: 1.3s"></span>
					<span
						class="point"
						style="left: 42%; top: 65%; animation-delay: 2.2s"></span>
				</div>

				<div class="scan"></div>
				<div class="sensor"></div>
			</div>
		</div>

		<main>
			<div class="content">
				<div class="eyebrow">Adaptive LiDAR Perception</div>

				<h1>Li<span>Dimention</span></h1>

				<p class="description">
					Adaptive 2.5D LiDAR mapping that changes spatial resolution with
					distance, preserving detail where it matters.
				</p>

				<div class="actions">
					<a class="btn" href="/render">Explore Demo</a>
					<a class="btn secondary" href="/pipeline">Pipeline</a>
					<a class="btn secondary" href="/compare">Compare</a>
				</div>

				<div class="metrics">
					<div class="metric">
						<strong>~25 FPS</strong>
						<small>Processing</small>
					</div>

					<div class="metric">
						<strong>95-98%*</strong>
						<small>Memory Reduction</small>
					</div>
				</div>

				<p class="metric-note">
					* Compared with the full dense 3D representation.
					<a href="/compare">See comparison</a>
				</p>
			</div>
		</main>
	</body>
</html>
