<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>LiDimension | Prerecorded Viewer</title>

		<link rel="stylesheet" href="/css/global.css" />
		<link rel="stylesheet" href="/css/prerecorded.css" />
	</head>

	<body>
		<header id="topbar">
			<div class="brand-group">
				<a id="brand" href="/" title="Back to Home">
					<span class="brand-name">Li<span>Dimension</span></span>
				</a>

				<span class="brand-eyebrow">Prerecorded Viewer</span>
			</div>

			<nav id="view-tabs">
				<button class="view-tab active" data-video="video1" type="button">
					Raster 3D
				</button>

				<button class="view-tab" data-video="video2" type="button">
					Raster 2D
				</button>

				<button class="view-tab" data-video="video3" type="button">
					Point Cloud
				</button>
			</nav>

			<div class="topbar-actions">
				<a class="nav-btn" href="/pipeline">Pipeline</a>
				<a class="nav-btn" href="/compare">Compare</a>
				<a class="nav-btn" href="/">← Home</a>
			</div>
		</header>

		<main id="video-viewer">
			<div class="video-panel active" id="video1">
				<iframe
					src="https://www.youtube.com/embed/68GRgdNKXlo"
					title="LiDimension - Raster 3D"
					allow="
						accelerometer;
						autoplay;
						clipboard-write;
						encrypted-media;
						gyroscope;
						picture-in-picture;
						web-share;
					"
					allowfullscreen>
				</iframe>
			</div>

			<div class="video-panel" id="video2"></div>

			<div class="video-panel" id="video3"></div>
		</main>

		<script>
			const videoSources = {
				video1: {
					id: "68GRgdNKXlo",
					title: "LiDimension - Raster 3D",
				},
				video2: {
					id: "GhEQMlR-5Mg",
					title: "LiDimension - Raster 2D",
				},
				video3: {
					id: "H-MhTKdv82E",
					title: "LiDimension - Point Cloud",
				},
			};

			const tabs = document.querySelectorAll(".view-tab");
			const videos = document.querySelectorAll(".video-panel");

			function loadVideo(panel) {
				if (panel.querySelector("iframe")) {
					return;
				}

				const video = videoSources[panel.id];

				const iframe = document.createElement("iframe");

				iframe.src = `https://www.youtube.com/embed/${video.id}`;
				iframe.title = video.title;

				iframe.allow =
					"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

				iframe.allowFullscreen = true;

				panel.appendChild(iframe);
			}

			for (const tab of tabs) {
				tab.addEventListener("click", () => {
					const target = tab.dataset.video;

					for (const otherTab of tabs) {
						otherTab.classList.toggle("active", otherTab === tab);
					}

					for (const video of videos) {
						video.classList.toggle("active", video.id === target);
					}

					loadVideo(document.getElementById(target));
				});
			}
		</script>
	</body>
</html>
