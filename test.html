<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Radial Grid Triangles</title>

		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #111;
			}

			canvas {
				display: block;
			}

			#info {
				position: fixed;
				top: 12px;
				left: 12px;
				color: white;
				font-family: monospace;
				font-size: 13px;
				line-height: 1.45;
				white-space: pre;
				z-index: 10;
			}
		</style>
	</head>

	<body>
		<div id="info"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">
			import * as THREE from "three";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";

			// ============================================================
			// Configuration
			// ============================================================

			const TAU = Math.PI * 2;

			// ============================================================
			// Radial Band
			// ============================================================

			class RadialBand {
				constructor(start, end, radialResolution) {
					this.start = start;
					this.end = end;
					this.radial_resolution = radialResolution;
				}
			}

			// ============================================================
			// Radial Grid
			// ============================================================

			class RadialGrid {
				constructor(bands, angularCellFactor = 1.0) {
					this.bands = bands;
					this.angular_cell_factor = angularCellFactor;

					this._validate();
					this._build();
				}

				_validate() {
					let expectedStart = this.bands[0].start;

					for (let i = 0; i < this.bands.length; i++) {
						const band = this.bands[i];

						if (Math.abs(band.start - expectedStart) > 1e-6) {
							throw new Error(
								`Band ${i} does not start where the previous band ends.`,
							);
						}

						if (band.end <= band.start) {
							throw new Error(`Invalid band ${i}.`);
						}

						if (band.radial_resolution <= 0) {
							throw new Error(`Invalid resolution for band ${i}.`);
						}

						expectedStart = band.end;
					}
				}

				_build() {
					this.numCells = 0;

					for (const band of this.bands) {
						const ringCount = Math.ceil(
							(band.end - band.start) / band.radial_resolution,
						);

						const actualResolution = (band.end - band.start) / ringCount;

						const midpoint = band.start + (band.end - band.start) * 0.5;

						const targetTangentialSize =
							actualResolution * this.angular_cell_factor;

						const angularSectors = Math.max(
							1,
							Math.ceil((2 * Math.PI * midpoint) / targetTangentialSize),
						);

						band.ring_count = ringCount;

						band.actual_resolution = actualResolution;

						band.angular_sectors = angularSectors;

						band.cell_count = ringCount * angularSectors;

						this.numCells += band.cell_count;
					}
				}

				describe() {
					console.log("[RADIAL GRID]");

					for (let i = 0; i < this.bands.length; i++) {
						const band = this.bands[i];

						console.log(
							`B${i}: ` +
								`${band.start.toFixed(2)}-${band.end.toFixed(2)} m | ` +
								`dr=${band.actual_resolution.toFixed(3)} | ` +
								`rings=${band.ring_count} | ` +
								`sectors=${band.angular_sectors} | ` +
								`cells=${band.cell_count}`,
						);
					}

					console.log(`Total cells: ${this.numCells}`);
				}
			}

			// ============================================================
			// Grid
			// ============================================================

			const radialGrid = new RadialGrid(
				[
					new RadialBand(0.0, 10.0, 0.3),

					new RadialBand(10.0, 30.0, 0.45),

					new RadialBand(30.0, 60.0, 0.7),

					new RadialBand(60.0, 100.0, 1.0),
				],
				1.0,
			);

			radialGrid.describe();

			// ============================================================
			// Mesh Generation
			// ============================================================

			const vertices = [];
			const indices = [];

			function addVertex(radius, theta) {
				const x = radius * Math.cos(theta);

				const y = radius * Math.sin(theta);

				const index = vertices.length / 3;

				vertices.push(x, y, 0);

				return index;
			}

			// ============================================================
			// Generate Each Band Independently
			// ============================================================
			//
			// IMPORTANT:
			//
			// A band has its own angular sector count.
			//
			// B0: 107 sectors
			// B1: 283 sectors
			// B2: 406 sectors
			// B3: 503 sectors
			//
			// Therefore sectors are NEVER connected by index
			// across band boundaries.
			//
			// ============================================================

			for (
				let bandIndex = 0;
				bandIndex < radialGrid.bands.length;
				bandIndex++
			) {
				const band = radialGrid.bands[bandIndex];

				const sectors = band.angular_sectors;

				const rings = band.ring_count;

				const dr = band.actual_resolution;

				// --------------------------------------------------------
				// Vertices
				// --------------------------------------------------------

				const bandVertices = [];

				for (let ring = 0; ring <= rings; ring++) {
					const radius = band.start + ring * dr;

					const ringVertices = [];

					// ----------------------------------------------------
					// Center
					// ----------------------------------------------------

					if (radius <= 1e-6) {
						const center = addVertex(0, 0);

						for (let sector = 0; sector < sectors; sector++) {
							ringVertices.push(center);
						}
					}

					// ----------------------------------------------------
					// Normal ring
					// ----------------------------------------------------
					else {
						for (let sector = 0; sector < sectors; sector++) {
							const theta = (sector / sectors) * TAU;

							ringVertices.push(addVertex(radius, theta));
						}
					}

					bandVertices.push(ringVertices);
				}

				// --------------------------------------------------------
				// Triangles
				// --------------------------------------------------------

				for (let ring = 0; ring < rings; ring++) {
					const inner = bandVertices[ring];

					const outer = bandVertices[ring + 1];

					const innerRadius = band.start + ring * dr;

					for (let sector = 0; sector < sectors; sector++) {
						const nextSector = (sector + 1) % sectors;

						const a = inner[sector];

						const b = inner[nextSector];

						const c = outer[sector];

						const d = outer[nextSector];

						// ------------------------------------------------
						// Center fan
						// ------------------------------------------------

						if (innerRadius <= 1e-6) {
							indices.push(a, c, d);

							continue;
						}

						// ------------------------------------------------
						// Normal quad
						// ------------------------------------------------

						indices.push(
							a,
							c,
							b,

							b,
							c,
							d,
						);
					}
				}
			}

			// ============================================================
			// Three.js Scene
			// ============================================================

			const scene = new THREE.Scene();

			scene.background = new THREE.Color(0x111111);

			const camera = new THREE.PerspectiveCamera(
				55,
				window.innerWidth / window.innerHeight,
				0.1,
				500,
			);

			camera.position.set(0, -115, 120);

			const renderer = new THREE.WebGLRenderer({
				antialias: true,
			});

			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

			renderer.setSize(window.innerWidth, window.innerHeight);

			document.body.appendChild(renderer.domElement);

			const controls = new OrbitControls(camera, renderer.domElement);

			controls.target.set(0, 0, 0);

			controls.update();

			// ============================================================
			// Ground Geometry
			// ============================================================

			const geometry = new THREE.BufferGeometry();

			geometry.setAttribute(
				"position",
				new THREE.Float32BufferAttribute(vertices, 3),
			);

			geometry.setIndex(indices);

			geometry.computeVertexNormals();

			// ============================================================
			// Solid Mesh
			// ============================================================

			const solidMaterial = new THREE.MeshBasicMaterial({
				color: 0x444444,
				side: THREE.DoubleSide,
				transparent: true,
				opacity: 0.55,
			});

			const solidMesh = new THREE.Mesh(geometry, solidMaterial);

			scene.add(solidMesh);

			// ============================================================
			// Wireframe
			// ============================================================

			const wireMaterial = new THREE.MeshBasicMaterial({
				color: 0x999999,
				wireframe: true,
				side: THREE.DoubleSide,
			});

			const wireframe = new THREE.Mesh(geometry, wireMaterial);

			scene.add(wireframe);

			// ============================================================
			// Center Marker
			// ============================================================

			const center = new THREE.Mesh(
				new THREE.SphereGeometry(0.35, 12, 12),
				new THREE.MeshBasicMaterial({
					color: 0xffffff,
				}),
			);

			scene.add(center);

			// ============================================================
			// Information
			// ============================================================

			document.getElementById("info").textContent =
				`Radial Ground Mesh\n` +
				`----------------------\n` +
				`Grid cells: ${radialGrid.numCells.toLocaleString()}\n` +
				`Mesh vertices: ${(vertices.length / 3).toLocaleString()}\n` +
				`Triangles: ${(indices.length / 3).toLocaleString()}\n\n` +
				radialGrid.bands
					.map(
						(band, i) =>
							`B${i}: ` +
							`${band.ring_count} rings × ` +
							`${band.angular_sectors} sectors`,
					)
					.join("\n");

			// ============================================================
			// Resize
			// ============================================================

			window.addEventListener("resize", () => {
				camera.aspect = window.innerWidth / window.innerHeight;

				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			// ============================================================
			// Render
			// ============================================================

			function animate() {
				requestAnimationFrame(animate);

				renderer.render(scene, camera);
			}

			animate();
		</script>
	</body>
</html>
