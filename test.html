<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Radial Grid + Render Vertices</title>

		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #111;
			}

			canvas {
				display: block;
			}

			#info {
				position: fixed;
				top: 12px;
				left: 12px;
				color: white;
				font-family: monospace;
				font-size: 13px;
				line-height: 1.45;
				white-space: pre;
				z-index: 10;
			}
		</style>
	</head>

	<body>
		<div id="info"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">
			import * as THREE from "three";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";

			// ============================================================
			// Configuration
			// ============================================================

			const VERTEX_SKIP = 2;
			const VERTEX_SIZE = 0.28;

			// ============================================================
			// Radial Band
			// ============================================================

			class RadialBand {
				constructor(start, end, radialResolution) {
					this.start = start;
					this.end = end;
					this.radial_resolution = radialResolution;
				}
			}

			// ============================================================
			// Radial Grid
			// ============================================================

			class RadialGrid {
				constructor(bands, angularCellFactor = 1.0) {
					this.bands = bands;
					this.angular_cell_factor = angularCellFactor;

					this._validate();
					this._build();
				}

				_validate() {
					let expectedStart = this.bands[0].start;

					for (let i = 0; i < this.bands.length; i++) {
						const band = this.bands[i];

						if (Math.abs(band.start - expectedStart) > 1e-6) {
							throw new Error(
								`Band ${i} does not start where the previous band ends.`,
							);
						}

						if (band.end <= band.start) {
							throw new Error(`Invalid band ${i}.`);
						}

						if (band.radial_resolution <= 0) {
							throw new Error(`Invalid resolution for band ${i}.`);
						}

						expectedStart = band.end;
					}
				}

				_build() {
					this.numCells = 0;

					for (const band of this.bands) {
						const ringCount = Math.ceil(
							(band.end - band.start) / band.radial_resolution,
						);

						const actualResolution = (band.end - band.start) / ringCount;

						const midpoint = band.start + (band.end - band.start) * 0.5;

						const targetTangentialSize =
							actualResolution * this.angular_cell_factor;

						const angularSectors = Math.max(
							1,
							Math.ceil((2 * Math.PI * midpoint) / targetTangentialSize),
						);

						band.ring_count = ringCount;

						band.actual_resolution = actualResolution;

						band.angular_sectors = angularSectors;

						band.cell_count = ringCount * angularSectors;

						this.numCells += band.cell_count;
					}
				}
			}

			// ============================================================
			// Grid
			// ============================================================

			const radialGrid = new RadialGrid(
				[
					new RadialBand(0.0, 10.0, 0.3),
					new RadialBand(10.0, 30.0, 0.45),
					new RadialBand(30.0, 60.0, 0.7),
					new RadialBand(60.0, 100.0, 1.0),
				],
				1.0,
			);

			// ============================================================
			// Render Vertex Generation
			// ============================================================

			const TAU = Math.PI * 2;

			const vertices = [];
			const vertexMap = new Map();

			function key(x, y) {
				return `${Math.round(x * 10000)}:` + `${Math.round(y * 10000)}`;
			}

			function addVertex(radius, theta) {
				const x = radius * Math.cos(theta);

				const y = radius * Math.sin(theta);

				const k = key(x, y);

				if (vertexMap.has(k)) {
					return vertexMap.get(k);
				}

				const index = vertices.length;

				vertices.push({
					x,
					y,
				});

				vertexMap.set(k, index);

				return index;
			}

			// ------------------------------------------------------------
			// Keep grid intersections.
			// ------------------------------------------------------------

			for (const band of radialGrid.bands) {
				for (let ring = 0; ring <= band.ring_count; ring++) {
					const radius = band.start + ring * band.actual_resolution;

					if (radius <= 0) {
						continue;
					}

					for (let sector = 0; sector < band.angular_sectors; sector++) {
						const theta = (sector / band.angular_sectors) * TAU;

						addVertex(radius, theta);
					}
				}
			}

			// ------------------------------------------------------------
			// Sparse points along sector edges.
			//
			// Every VERTEX_SKIP-th point is kept.
			// Endpoints are always kept.
			// ------------------------------------------------------------

			for (const band of radialGrid.bands) {
				const sectors = band.angular_sectors;

				const length = band.end - band.start;

				const sampleCount = Math.max(1, Math.ceil(length / 0.75));

				for (let sector = 0; sector < sectors; sector++) {
					const theta = (sector / sectors) * TAU;

					for (let i = 0; i <= sampleCount; i++) {
						if (i !== 0 && i !== sampleCount && i % VERTEX_SKIP !== 0) {
							continue;
						}

						const t = i / sampleCount;

						const radius = band.start + length * t;

						if (radius <= 0) {
							continue;
						}

						addVertex(radius, theta);
					}
				}
			}

			// ============================================================
			// Three.js
			// ============================================================

			const scene = new THREE.Scene();

			scene.background = new THREE.Color(0x111111);

			const camera = new THREE.PerspectiveCamera(
				55,
				window.innerWidth / window.innerHeight,
				0.1,
				500,
			);

			camera.position.set(0, -115, 120);

			const renderer = new THREE.WebGLRenderer({
				antialias: true,
			});

			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

			renderer.setSize(window.innerWidth, window.innerHeight);

			document.body.appendChild(renderer.domElement);

			const controls = new OrbitControls(camera, renderer.domElement);

			controls.target.set(0, 0, 0);

			controls.update();

			// ============================================================
			// Render Vertices
			// ============================================================

			const positions = new Float32Array(vertices.length * 3);

			for (let i = 0; i < vertices.length; i++) {
				positions[i * 3] = vertices[i].x;

				positions[i * 3 + 1] = vertices[i].y;

				positions[i * 3 + 2] = 0.2;
			}

			const pointGeometry = new THREE.BufferGeometry();

			pointGeometry.setAttribute(
				"position",
				new THREE.BufferAttribute(positions, 3),
			);

			const pointMaterial = new THREE.PointsMaterial({
				color: 0xffffff,
				size: VERTEX_SIZE,
				sizeAttenuation: true,
			});

			scene.add(new THREE.Points(pointGeometry, pointMaterial));

			// ============================================================
			// Grid Lines
			// ============================================================

			const linePositions = [];

			function addLine(x0, y0, x1, y1) {
				linePositions.push(x0, y0, 0.0, x1, y1, 0.0);
			}

			// Ring boundaries

			const ringRadii = [];

			for (const band of radialGrid.bands) {
				for (let ring = 0; ring <= band.ring_count; ring++) {
					const radius = band.start + ring * band.actual_resolution;

					if (ringRadii.every((r) => Math.abs(r - radius) > 1e-6)) {
						ringRadii.push(radius);
					}
				}
			}

			for (const radius of ringRadii) {
				if (radius <= 0) {
					continue;
				}

				const segments = Math.max(128, Math.ceil((TAU * radius) / 0.5));

				for (let i = 0; i < segments; i++) {
					const a0 = (i / segments) * TAU;

					const a1 = ((i + 1) / segments) * TAU;

					addLine(
						radius * Math.cos(a0),
						radius * Math.sin(a0),
						radius * Math.cos(a1),
						radius * Math.sin(a1),
					);
				}
			}

			// Sector boundaries

			for (const band of radialGrid.bands) {
				for (let sector = 0; sector < band.angular_sectors; sector++) {
					const theta = (sector / band.angular_sectors) * TAU;

					const c = Math.cos(theta);

					const s = Math.sin(theta);

					addLine(band.start * c, band.start * s, band.end * c, band.end * s);
				}
			}

			const lineGeometry = new THREE.BufferGeometry();

			lineGeometry.setAttribute(
				"position",
				new THREE.Float32BufferAttribute(linePositions, 3),
			);

			const lineMaterial = new THREE.LineBasicMaterial({
				color: 0x666666,
			});

			scene.add(new THREE.LineSegments(lineGeometry, lineMaterial));

			// ============================================================
			// Center
			// ============================================================

			scene.add(
				new THREE.Mesh(
					new THREE.SphereGeometry(0.35, 12, 12),
					new THREE.MeshBasicMaterial({
						color: 0xffffff,
					}),
				),
			);

			// ============================================================
			// Info
			// ============================================================

			document.getElementById("info").textContent =
				`Radial Grid + Sparse Render Vertices\n` +
				`-------------------------------------\n` +
				`Grid cells: ${radialGrid.numCells.toLocaleString()}\n` +
				`Render vertices: ${vertices.length.toLocaleString()}\n` +
				`Vertex skip: ${VERTEX_SKIP}`;

			// ============================================================
			// Resize
			// ============================================================

			window.addEventListener("resize", () => {
				camera.aspect = window.innerWidth / window.innerHeight;

				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			// ============================================================
			// Render
			// ============================================================

			function animate() {
				requestAnimationFrame(animate);

				renderer.render(scene, camera);
			}

			animate();
		</script>
	</body>
</html>
