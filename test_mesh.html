<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Radial Grid Stitched Mesh</title>

		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #111;
			}

			canvas {
				display: block;
			}

			#info {
				position: fixed;
				top: 12px;
				left: 12px;
				color: white;
				font-family: monospace;
				font-size: 13px;
				line-height: 1.45;
				white-space: pre;
				z-index: 10;
			}
		</style>
	</head>

	<body>
		<div id="info"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">
			import * as THREE from "three";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";

			// ============================================================
			// Configuration
			// ============================================================

			const TAU = Math.PI * 2;

			// ============================================================
			// Radial Band
			// ============================================================

			class RadialBand {
				constructor(start, end, radialResolution) {
					this.start = start;
					this.end = end;
					this.radial_resolution = radialResolution;
				}
			}

			// ============================================================
			// Radial Grid
			// ============================================================

			class RadialGrid {
				constructor(bands, angularCellFactor = 1.0) {
					this.bands = bands;
					this.angular_cell_factor = angularCellFactor;

					this._validate();
					this._build();
				}

				_validate() {
					let expectedStart = this.bands[0].start;

					for (let i = 0; i < this.bands.length; i++) {
						const band = this.bands[i];

						if (Math.abs(band.start - expectedStart) > 1e-6) {
							throw new Error(
								`Band ${i} does not start where the previous band ends.`,
							);
						}

						if (band.end <= band.start) {
							throw new Error(`Invalid band ${i}.`);
						}

						if (band.radial_resolution <= 0) {
							throw new Error(`Invalid resolution for band ${i}.`);
						}

						expectedStart = band.end;
					}
				}

				_build() {
					this.numCells = 0;

					for (const band of this.bands) {
						const ringCount = Math.ceil(
							(band.end - band.start) / band.radial_resolution,
						);

						const actualResolution = (band.end - band.start) / ringCount;

						const midpoint = band.start + (band.end - band.start) * 0.5;

						const targetTangentialSize =
							actualResolution * this.angular_cell_factor;

						const angularSectors = Math.max(
							1,
							Math.ceil((2 * Math.PI * midpoint) / targetTangentialSize),
						);

						band.ring_count = ringCount;
						band.actual_resolution = actualResolution;
						band.angular_sectors = angularSectors;
						band.cell_count = ringCount * angularSectors;

						this.numCells += band.cell_count;
					}
				}
			}

			// ============================================================
			// Grid
			// ============================================================

			const radialGrid = new RadialGrid(
				[
					new RadialBand(0.0, 10.0, 0.3),
					new RadialBand(10.0, 30.0, 0.45),
					new RadialBand(30.0, 60.0, 0.7),
					new RadialBand(60.0, 100.0, 1.0),
				],
				1.0,
			);

			console.log("[RADIAL GRID]");

			for (let i = 0; i < radialGrid.bands.length; i++) {
				const band = radialGrid.bands[i];

				console.log(
					`B${i}: ` +
						`${band.start.toFixed(2)}-${band.end.toFixed(2)} m | ` +
						`dr=${band.actual_resolution.toFixed(3)} | ` +
						`rings=${band.ring_count} | ` +
						`sectors=${band.angular_sectors} | ` +
						`cells=${band.cell_count}`,
				);
			}

			console.log(`Total cells: ${radialGrid.numCells}`);

			// ============================================================
			// Mesh Storage
			// ============================================================

			const vertices = [];
			const indices = [];

			// ============================================================
			// Vertex Map
			// ============================================================

			const vertexMap = new Map();

			function normalizeAngle(angle) {
				angle %= TAU;

				if (angle < 0) {
					angle += TAU;
				}

				return angle;
			}

			function angleKey(angle) {
				return Math.round(normalizeAngle(angle) * 1e10);
			}

			function vertexKey(radius, angle) {
				return `${Math.round(radius * 1e8)}:` + `${angleKey(angle)}`;
			}

			function addVertex(radius, angle) {
				const normalizedAngle = normalizeAngle(angle);

				const key = vertexKey(radius, normalizedAngle);

				const existing = vertexMap.get(key);

				if (existing !== undefined) {
					return existing;
				}

				const index = vertices.length / 3;

				vertices.push(
					radius * Math.cos(normalizedAngle),
					radius * Math.sin(normalizedAngle),
					0,
				);

				vertexMap.set(key, index);

				return index;
			}

			// ============================================================
			// Angular Samples
			// ============================================================

			function getBandAngles(band) {
				const angles = [];

				for (let sector = 0; sector < band.angular_sectors; sector++) {
					angles.push((sector / band.angular_sectors) * TAU);
				}

				return angles;
			}

			function mergeAngles(...angleLists) {
				const map = new Map();

				for (const list of angleLists) {
					for (const angle of list) {
						const normalized = normalizeAngle(angle);

						map.set(angleKey(normalized), normalized);
					}
				}

				return [...map.values()].sort((a, b) => a - b);
			}

			// ============================================================
			// Shared Band Boundaries
			// ============================================================
			//
			// A transition gets the union of the angular vertices
			// from both neighboring bands.
			//
			// This creates a denser shared ring at:
			//
			//     10m
			//     30m
			//     60m
			//
			// Both sides reference exactly the same vertices.
			//
			// ============================================================

			const boundaryAngles = [];

			for (let boundary = 0; boundary <= radialGrid.bands.length; boundary++) {
				// Center
				if (boundary === 0) {
					boundaryAngles.push([0]);
					continue;
				}

				// Outer boundary
				if (boundary === radialGrid.bands.length) {
					const band = radialGrid.bands[boundary - 1];

					boundaryAngles.push(getBandAngles(band));

					continue;
				}

				// Interior band boundary
				const previous = radialGrid.bands[boundary - 1];

				const next = radialGrid.bands[boundary];

				boundaryAngles.push(
					mergeAngles(getBandAngles(previous), getBandAngles(next)),
				);
			}

			// ============================================================
			// Create Ring
			// ============================================================

			function createRing(radius, angles) {
				if (radius <= 1e-6) {
					const center = addVertex(0, 0);

					return angles.map(() => center);
				}

				return angles.map((angle) => addVertex(radius, angle));
			}

			// ============================================================
			// Stitch Two Rings
			// ============================================================
			//
			// Handles different vertex counts between rings.
			//
			// The final interval explicitly wraps from the last
			// angular vertex back to the first vertex + 2π.
			//
			// This prevents the θ = 0 seam.
			//
			// ============================================================

			function stitchRings(innerRing, innerAngles, outerRing, outerAngles) {
				const innerCount = innerRing.length;
				const outerCount = outerRing.length;

				// --------------------------------------------------------
				// Center -> outer ring
				// --------------------------------------------------------

				if (innerCount === 1) {
					const center = innerRing[0];

					for (let j = 0; j < outerCount; j++) {
						const next = (j + 1) % outerCount;

						indices.push(center, outerRing[j], outerRing[next]);
					}

					return;
				}

				// --------------------------------------------------------
				// General ring stitching
				// --------------------------------------------------------

				let i = 0;
				let j = 0;

				const epsilon = 1e-10;

				while (true) {
					const nextInner =
						i + 1 < innerCount ? innerAngles[i + 1] : innerAngles[0] + TAU;

					const nextOuter =
						j + 1 < outerCount ? outerAngles[j + 1] : outerAngles[0] + TAU;

					const currentInner = innerRing[i];

					const currentOuter = outerRing[j];

					// ----------------------------------------------------
					// Both rings finish their final interval.
					// ----------------------------------------------------

					if (i === innerCount - 1 && j === outerCount - 1) {
						/*
						 * Final quad crosses the θ=0 seam.
						 */
						const nextInnerIndex = 0;
						const nextOuterIndex = 0;

						indices.push(
							currentInner,
							currentOuter,
							innerRing[nextInnerIndex],

							innerRing[nextInnerIndex],
							currentOuter,
							outerRing[nextOuterIndex],
						);

						break;
					}

					// ----------------------------------------------------
					// Inner ring reaches its next vertex first.
					// ----------------------------------------------------

					if (nextInner < nextOuter - epsilon) {
						const nextInnerIndex = (i + 1) % innerCount;

						indices.push(currentInner, currentOuter, innerRing[nextInnerIndex]);

						i++;

						continue;
					}

					// ----------------------------------------------------
					// Outer ring reaches its next vertex first.
					// ----------------------------------------------------

					if (nextOuter < nextInner - epsilon) {
						const nextOuterIndex = (j + 1) % outerCount;

						indices.push(currentInner, outerRing[nextOuterIndex], currentOuter);

						j++;

						continue;
					}

					// ----------------------------------------------------
					// Both rings have a vertex at the same angle.
					// ----------------------------------------------------

					const nextInnerIndex = (i + 1) % innerCount;

					const nextOuterIndex = (j + 1) % outerCount;

					indices.push(
						currentInner,
						currentOuter,
						innerRing[nextInnerIndex],

						innerRing[nextInnerIndex],
						currentOuter,
						outerRing[nextOuterIndex],
					);

					i++;
					j++;
				}
			}

			// ============================================================
			// Build Bands
			// ============================================================

			for (
				let bandIndex = 0;
				bandIndex < radialGrid.bands.length;
				bandIndex++
			) {
				const band = radialGrid.bands[bandIndex];

				const rings = [];

				// --------------------------------------------------------
				// Create radial rings
				// --------------------------------------------------------

				for (let ring = 0; ring <= band.ring_count; ring++) {
					const radius = band.start + ring * band.actual_resolution;

					let angles;

					// Shared inner boundary
					if (ring === 0) {
						angles = boundaryAngles[bandIndex];
					}

					// Shared outer boundary
					else if (ring === band.ring_count) {
						angles = boundaryAngles[bandIndex + 1];
					}

					// Interior ring
					else {
						angles = getBandAngles(band);
					}

					rings.push({
						radius,
						angles,
						vertices: createRing(radius, angles),
					});
				}

				// --------------------------------------------------------
				// Stitch radial rings
				// --------------------------------------------------------

				for (let ring = 0; ring < rings.length - 1; ring++) {
					const inner = rings[ring];
					const outer = rings[ring + 1];

					stitchRings(
						inner.vertices,
						inner.angles,
						outer.vertices,
						outer.angles,
					);
				}
			}

			// ============================================================
			// Three.js Scene
			// ============================================================

			const scene = new THREE.Scene();

			scene.background = new THREE.Color(0x111111);

			const camera = new THREE.PerspectiveCamera(
				55,
				window.innerWidth / window.innerHeight,
				0.1,
				500,
			);

			camera.position.set(0, -115, 120);

			const renderer = new THREE.WebGLRenderer({
				antialias: true,
			});

			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

			renderer.setSize(window.innerWidth, window.innerHeight);

			document.body.appendChild(renderer.domElement);

			const controls = new OrbitControls(camera, renderer.domElement);

			controls.target.set(0, 0, 0);

			controls.update();

			// ============================================================
			// Geometry
			// ============================================================

			const geometry = new THREE.BufferGeometry();

			geometry.setAttribute(
				"position",
				new THREE.Float32BufferAttribute(vertices, 3),
			);

			geometry.setIndex(indices);

			geometry.computeVertexNormals();

			// ============================================================
			// Solid Mesh
			// ============================================================

			const solidMaterial = new THREE.MeshBasicMaterial({
				color: 0x444444,
				side: THREE.DoubleSide,
				transparent: true,
				opacity: 0.55,
			});

			const solidMesh = new THREE.Mesh(geometry, solidMaterial);

			scene.add(solidMesh);

			// ============================================================
			// Wireframe
			// ============================================================

			const wireMaterial = new THREE.MeshBasicMaterial({
				color: 0x999999,
				wireframe: true,
				side: THREE.DoubleSide,
			});

			const wireframe = new THREE.Mesh(geometry, wireMaterial);

			scene.add(wireframe);

			// ============================================================
			// Center Marker
			// ============================================================

			const center = new THREE.Mesh(
				new THREE.SphereGeometry(0.35, 12, 12),
				new THREE.MeshBasicMaterial({
					color: 0xffffff,
				}),
			);

			scene.add(center);

			// ============================================================
			// Information
			// ============================================================

			const boundaryInfo = boundaryAngles
				.map((angles) => angles.length)
				.join(" / ");

			document.getElementById("info").textContent =
				`Radial Ground Mesh\n` +
				`----------------------\n` +
				`Grid cells: ${radialGrid.numCells.toLocaleString()}\n` +
				`Mesh vertices: ${(vertices.length / 3).toLocaleString()}\n` +
				`Triangles: ${(indices.length / 3).toLocaleString()}\n` +
				`Boundary vertices: ${boundaryInfo}`;

			// ============================================================
			// Resize
			// ============================================================

			window.addEventListener("resize", () => {
				camera.aspect = window.innerWidth / window.innerHeight;

				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			// ============================================================
			// Render
			// ============================================================

			function animate() {
				requestAnimationFrame(animate);

				renderer.render(scene, camera);
			}

			animate();
		</script>
	</body>
</html>
